<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0e3a47" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="white" stroke-opacity="0.1" stroke-width="4" />

  <!-- Stylized Open Book / Mushaf Geometry -->
  <g transform="translate(96, 128)">
    <!-- Left Page -->
    <path d="M160 220 C 90 200, 30 220, 10 240 L 10 40 C 30 20, 90 0, 160 20 Z" fill="url(#pageGrad)" />
    
    <!-- Right Page -->
    <path d="M160 220 C 230 200, 290 220, 310 240 L 310 40 C 290 20, 230 0, 160 20 Z" fill="url(#pageGrad)" />
    
    <!-- Center Spine Bookmark / Ribbon -->
    <path d="M152 10 L 168 10 L 168 180 L 160 170 L 152 180 Z" fill="url(#goldGrad)" />

    <!-- Subtle Page Lines (Left) -->
    <line x1="40" y1="70" x2="130" y2="70" stroke="#0e3a47" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="100" x2="130" y2="100" stroke="#0e3a47" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="130" x2="110" y2="130" stroke="#0e3a47" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round" />

    <!-- Subtle Page Lines (Right) -->
    <line x1="190" y1="70" x2="280" y2="70" stroke="#0e3a47" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round" />
    <line x1="190" y1="100" x2="280" y2="100" stroke="#0e3a47" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round" />
    <line x1="190" y1="130" x2="260" y2="130" stroke="#0e3a47" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
